<table>
    $for(papers)$
    <tr>
      <td class="pub-mark">
          $if(award)$
          <span class="pub-award" title="$award$" aria-label="$award$" role="img"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2.5.5A.5.5 0 0 1 3 0h10a.5.5 0 0 1 .5.5q0 .807-.034 1.536a3 3 0 1 1-1.133 5.89c-.79 1.865-1.878 2.777-2.833 3.011v2.173l1.425.356c.194.048.377.135.537.255L13.3 15.1a.5.5 0 0 1-.3.9H3a.5.5 0 0 1-.3-.9l1.838-1.379c.16-.12.343-.207.537-.255L6.5 13.11v-2.173c-.955-.234-2.043-1.146-2.833-3.012a3 3 0 1 1-1.132-5.89A33 33 0 0 1 2.5.5m.099 2.54a2 2 0 0 0 .72 3.935c-.333-1.05-.588-2.346-.72-3.935m10.083 3.935a2 2 0 0 0 .72-3.935c-.133 1.59-.388 2.885-.72 3.935"/></svg></span>
          $endif$
      </td>
      <td class="pub">
          <span class="pub-title">
              $if(pdf)$
              <a href = $pdf$>
              $endif$
              $title$
              $if(pdf)$
              </a>
              $endif$
          </span>
          $if(note)$
          <br/><span class="pub-note">[$note$]</span>
          $endif$
          <br/>
          <span class="pub-authors">$authors$</span>
          <br/>

	$if(venue)$
	<span class="pub-venue">$venue$</span>.
	$endif$

	$if(month)$
	<span class="pub-month">$month$</span>.
	$endif$

	$if(slides)$
	 <a href=$slides$ title="slides" class="icon"><img src="/images/easel-fill.svg"/></a>
	 $endif$

    $if(arxiv)$
     <a href=$arxiv$ title="arxiv" class="icon"><img src="/images/archive.svg"/></a>
    $endif$
    $if(video)$
     <a href=$video$ title="video" class="icon">
         <img src="/images/camera-reels.svg"/>
     </a>
    $endif$

    $if(code)$
     <a href=$code$ title="code" class="icon">
         <img src="images/code-square.svg"/>
     </a>
     $endif$
	</td>
    </tr>
    $endfor$
</table>
